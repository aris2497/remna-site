<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Bez viewport-fit=cover: Capacitor sam odsuwa stronę od pasków systemowych Androida.
       (Z cover marginesy trafiają do CSS za wcześnie i zostają 0, więc dolne menu wchodziło pod pasek nawigacji). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
  <title>Remna – deadstock fabrics from European shops</title>
  <meta name="description" content="Search deadstock fabrics from 25+ European shops: silk, wool, linen, cotton and more. Filter by composition, colour, pattern, weight and price per metre. Buy directly from the shop.">
  <!-- Podgląd linku (Facebook, Messenger, WhatsApp, Instagram) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Remna">
  <meta property="og:title" content="Remna – deadstock fabrics from European shops">
  <meta property="og:description" content="30,000+ deadstock fabrics from 26 European shops in one place. Search by material, composition, colour and pattern.">
  <meta property="og:url" content="https://remnafabrics.com/">
  <meta property="og:image" content="https://remnafabrics.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Remna: deadstock fabrics from European shops in one place">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="pl_PL">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone: po „Do ekranu początkowego” otwiera się jak aplikacja, bez paska Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Remna">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css?v=3e5b989">
</head>
<body>
  <div id="app">
    <!-- SZUKAJ -->
    <section class="view" id="view-search" data-view="search">
      <header class="top">
        <div class="brand">
          <span class="wordmark">Remna</span>
          <span class="tagline" data-i18n="app.tagline"></span>
        </div>
        <form class="searchbar" id="search-form" role="search" autocomplete="off">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" enterkeyhint="search" data-i18n-placeholder="search.placeholder" aria-label="Szukaj">
          <button type="button" class="icon-btn" id="q-clear" hidden data-i18n-aria="search.clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <button type="button" class="filter-btn" id="open-filters">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span data-i18n="filters.open"></span>
            <span class="badge" id="filter-count" hidden></span>
          </button>
        </form>
        <div class="quick" id="quick" role="toolbar"></div>
      </header>

      <div class="banner" id="mode-banner" hidden></div>

      <!-- Powitanie przy pierwszej wizycie -->
      <section class="intro" id="intro" hidden aria-labelledby="intro-title">
        <button type="button" class="icon-btn intro-close" id="intro-close" data-i18n-aria="intro.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <h2 id="intro-title" data-i18n="intro.title"></h2>
        <p data-i18n="intro.lead"></p>
        <ul>
          <li data-i18n="intro.point1"></li>
          <li data-i18n="intro.point2"></li>
          <li data-i18n="intro.point3"></li>
        </ul>
        <p class="intro-ios" id="intro-ios" hidden data-i18n="intro.ios"></p>
        <button type="button" class="primary-btn intro-go" id="intro-go" data-i18n="intro.go"></button>
      </section>

      <div class="resultbar">
        <span id="result-count" aria-live="polite"></span>
        <div class="resultbar-actions">
          <button type="button" class="text-btn" id="save-alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span data-i18n="alerts.save"></span>
          </button>
          <label class="sort">
            <span class="sr-only" data-i18n="sort.label"></span>
            <select id="sort"></select>
          </label>
        </div>
      </div>

      <main class="grid" id="results" aria-busy="true"></main>
      <div class="more-wrap"><button type="button" class="ghost-btn" id="load-more" hidden data-i18n="results.more"></button></div>
    </section>

    <!-- ULUBIONE -->
    <section class="view" id="view-favorites" data-view="favorites" hidden>
      <header class="page-head"><h1 data-i18n="fav.title"></h1></header>
      <main class="grid" id="fav-list"></main>
    </section>

    <!-- ALERTY -->
    <section class="view" id="view-alerts" data-view="alerts" hidden>
      <header class="page-head">
        <h1 data-i18n="alerts.title"></h1>
        <p class="lead" data-i18n="alerts.intro"></p>
      </header>
      <main id="alert-list" class="alert-list"></main>
      <p class="note" data-i18n="alerts.pushSoon"></p>
    </section>

    <!-- WIĘCEJ -->
    <section class="view" id="view-more" data-view="more" hidden>
      <header class="page-head"><h1 data-i18n="more.title"></h1></header>
      <main class="more">
        <div class="setting">
          <label for="lang" data-i18n="more.language"></label>
          <select id="lang">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
          </select>
        </div>
        <h2 data-i18n="more.sources"></h2>
        <p class="lead" id="sources-note"></p>
        <ul class="shop-list" id="shop-list"></ul>
        <h2 data-i18n="more.about"></h2>
        <p data-i18n="more.aboutText"></p>
        <h2 data-i18n="more.feedback"></h2>
        <p data-i18n="more.feedbackText"></p>
        <p><a class="ghost-btn" id="feedback" href="#" data-i18n="more.feedbackButton"></a></p>
        <h2 data-i18n="more.privacy"></h2>
        <p><span data-i18n="more.privacyText"></span> <a id="privacy-link" href="https://remnafabrics.com/privacy/" data-i18n="more.privacyLink"></a></p>
        <label class="setting toggle">
          <span data-i18n="more.stats"></span>
          <input type="checkbox" id="stats-toggle">
        </label>
        <p class="note" id="stats-note"></p>
        <h2 data-i18n="more.shopOwner"></h2>
        <p><span data-i18n="more.shopOwnerText"></span> <span class="contact" id="contact"></span></p>
        <p class="note" id="version"></p>
      </main>
    </section>

    <!-- DOLNE MENU -->
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="search" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span data-i18n="tab.search"></span>
      </button>
      <button type="button" data-tab="favorites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span data-i18n="tab.favorites"></span>
      </button>
      <button type="button" data-tab="alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span data-i18n="tab.alerts"></span>
        <span class="badge" id="alerts-badge" hidden></span>
      </button>
      <button type="button" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        <span data-i18n="tab.more"></span>
      </button>
    </nav>
  </div>

  <!-- FILTRY -->
  <div class="sheet-backdrop" id="filters-backdrop" hidden></div>
  <section class="sheet" id="filters-sheet" role="dialog" aria-modal="true" aria-labelledby="filters-title" hidden>
    <header class="sheet-head">
      <h2 id="filters-title" data-i18n="filters.title"></h2>
      <button type="button" class="text-btn" id="filters-reset" data-i18n="filters.reset"></button>
    </header>
    <div class="sheet-body" id="filters-body"></div>
    <footer class="sheet-foot">
      <button type="button" class="primary-btn" id="filters-apply"></button>
    </footer>
  </section>

  <!-- SZCZEGÓŁY -->
  <section class="detail" id="detail" role="dialog" aria-modal="true" hidden>
    <div class="detail-scroll" id="detail-body"></div>
    <footer class="detail-foot">
      <button type="button" class="icon-btn round" id="detail-fav" data-i18n-aria="detail.save">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      </button>
      <button type="button" class="icon-btn round" id="detail-share" data-i18n-aria="detail.share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      </button>
      <a class="primary-btn" id="detail-open" target="_blank" rel="noopener" data-i18n="detail.open"></a>
    </footer>
    <button type="button" class="icon-btn round detail-close" id="detail-close" data-i18n-aria="detail.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js?v=3e5b989"></script>
  <script src="i18n.js?v=3e5b989"></script>
  <script src="i18n-langs.js?v=3e5b989"></script>
  <script src="filters.js?v=3e5b989"></script>
  <script src="data.js?v=3e5b989"></script>
  <script src="native.js?v=3e5b989"></script>
  <script src="app.js?v=3e5b989"></script>
</body>
</html>
